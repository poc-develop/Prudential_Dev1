<template>
    <lightning-modal-header label="Reply"></lightning-modal-header>
    
    <lightning-modal-body>
        <div class="slds-p-around_medium reply-container">
            <div if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
            
            <lightning-textarea
                label="Reply"
                placeholder="Enter your reply here..."
                value={replyText}
                onchange={handleReplyChange}
                rows="16"
                class="reply"
                required>
            </lightning-textarea>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}>
        </lightning-button>
        &nbsp;
        <lightning-button
            variant="brand"
            label="Confirm"
            onclick={handleConfirm}
            disabled={isConfirmDisabled}>
        </lightning-button>
    </lightning-modal-footer>
</template>
