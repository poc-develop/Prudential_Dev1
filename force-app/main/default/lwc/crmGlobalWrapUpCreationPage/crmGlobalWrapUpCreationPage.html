<template>
	<div class="slds-page-header">
		<div class="slds-page-header__row">
			<div class="slds-page-header__col-title Case-title">
				<div class="slds-page-header__name">
					<div class="slds-page-header__name-title">
						<h1 class="page-title">
							<span class="slds-page-header__title slds-truncate" title="Create Wrap Up">
								Create Wrap Up
							</span>
						</h1>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div>
		<lightning-record-edit-form object-api-name="Case" onsuccess={handleSuccess} onsubmit={handleSubmit} record-id={recordId} density="comfy">
			<div class="slds-box slds-theme_default">

                <!-- 1.Case Details Section -->
				<div class="slds-text-heading_medium slds-m-bottom_medium">Case Details</div>
                <div class="slds-grid slds-wrap slds-gutters_medium slds-var-p-around_medium">
                    <!-- left fields -->
                    <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                        <div class="slds-form slds-form_stacked">

                            <!-- Record Type -->
                             <div class="slds-form-element slds-m-bottom_medium">
                                 <div class="slds-form-element__control">
                                     <lightning-input-field field-name="RecordTypeId" value={recordTypeId} disabled></lightning-input-field>
                                 </div>
                             </div>

                             <!-- Status -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="Status" data-id="Status" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Subject -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="Subject" data-id="Subject" value={Subject} disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- right fields -->
                    <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                        <div class="slds-form slds-form_stacked">
                            <!-- Case Origin -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="Origin" value={caseOrigin} disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Case Owner -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="OwnerId" data-id="ownerId" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Priority -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="Priority" data-id="priority" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2.Enquiry Details Section -->
                <div class="slds-text-heading_medium slds-m-bottom_medium">Enquiry Details</div>
                <div class="slds-grid slds-wrap slds-gutters_medium slds-var-p-around_medium">
                    <!-- left fields -->
                    <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                        <div class="slds-form slds-form_stacked">

                            <!-- Enquirer Name -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_EnquirerName__c" data-id="enquirerName" value={enquirerName} disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Contact Email -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="ContactEmail" value={contactEmail} data-id="contactEmail" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Account Name -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="AccountId" data-id="accountId" value={accountId} disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Client Code -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_ClientCode__c" value={clientCode} data-id="clientCode" disabled></lightning-input-field>
                                    <!-- <lightning-input type="text" label="Client Code" disabled></lightning-input> -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- right fields -->
                    <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                        <div class="slds-form slds-form_stacked">
                            <!-- Contact No. -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_ContactNumber__c" value={contactNumber} data-id="contactNo" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!--  -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <lightning-input class="slds-hidden" type="text" label="hidden"></lightning-input>
                            </div>

                            <!-- ID Number -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input type="text" label="ID Number" value={IDNumber} data-id="IDNumber" disabled></lightning-input>
                                </div>
                            </div>

                            <!-- Agent Code -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_AgentCode__c" data-id="agentCode" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- *****************Origin fields section***************** -->
                    <!-- Walk-in -->
                    <template if:true={walkIn}>
                        <!-- left fields -->
                        <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                            <!-- Ticket Number -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_TicketNumber__c" data-id="ticketNumber" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Cashier/Room Number -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_CounterNumber__c" data-id="counterNumber" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Start Time -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_WalkInStartTime__c" data-id="startTime" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>

                        <!-- right fields -->
                        <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                            <!-- Location of The Centre -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_LocationOfTheCentre__c" data-id="locationOfTheCentre" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Accompany By -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_AccompanyBy__c" data-id="accompanyBy" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- End Time -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_WalkInEndTime__c" data-id="endTime" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Letter -->
                    <template if:true={letter}>
                        <!-- left fields -->
                        <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                            <!-- Sender Name/Organization -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_LetterSender__c" data-id="letterSender" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Forwarded the Letter To -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_ForwardedTheLetterTo__c" data-id="forwardedTheLetterTo" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Channel of Receipt -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_ChannelOfReceipt__c" data-id="channelOfReceipt" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Log Number -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_LogNumber__c" data-id="logNumber" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>

                        <!-- right fields -->
                        <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                            <!-- Recipient -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_LetterRecipient__c" data-id="letterRecipient" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Date of Receipt -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_DateOfReceipt__c" data-id="dateOfReceipt" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Document Type -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_DocumentType__c" data-id="documentType" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Virtual Meeting -->
                    <template if:true={virtualMeeting}>
                        <!-- left fields -->
                        <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                            
                            <!-- Scheduled Time -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_ScheduledTime__c" data-id="scheduledTime" disabled></lightning-input-field>
                                </div>
                            </div>

                            <!-- Attendance -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_VM_Attendance__c" data-id="attendance" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>

                        <!-- right fields -->
                        <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                            <!-- Meeting Link -->
                            <div class="slds-form-element slds-m-bottom_medium">
                                <div class="slds-form-element__control">
                                    <lightning-input-field field-name="CRM_Global_VM_MeetingLink__c" data-id="meetingLink" disabled></lightning-input-field>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 3.Wrap Up Section -->
                <div class="slds-text-heading_medium slds-m-bottom_medium">Wrap Up</div>
                <div class="slds-grid slds-wrap slds-gutters_medium slds-var-p-around_medium">
                    <div class="slds-size_1-of-1 slds-large-size_1-of-1 master-case-form">
                        <!-- Enquiry Summary -->
                        <lightning-input-field field-name="CRM_Global_EnquirySummary__c" data-id="enquirySummary" required></lightning-input-field>
                    </div>

                    <div class="slds-size_1-of-1 slds-large-size_1-of-2 master-case-form">
                        <lightning-record-edit-form object-api-name="CRM_Global_CaseAssociatedItem__c" density="comfy">
                            <lightning-input-field field-name="CRM_Global_Channel__c" data-id="channel" required></lightning-input-field>
                        </lightning-record-edit-form>
                    </div>
                </div>

                <div class="slds-text-align_right slds-m-bottom_medium">
                    <lightning-button 
                        label="New Child Case" 
                        variant="brand-outline" 
                        onclick={handleNewChildCase}
                        class="slds-m-bottom_small">
                    </lightning-button>
                </div>

                <!-- 4.Enquiry Case -->
                <div class="slds-text-heading_medium slds-m-bottom_medium">Enquiry Case</div>
                <div class="case-container slds-m-bottom_large">
                    <!-- <div class="slds-text-heading_small slds-m-bottom_small wrap-up-header">Select Enquiry Case</div> -->
                    <div class="slds-truncate enquiry-case-section">
                        <div style="float: left; margin-top: 2px;">
                            <span class="slds-text-title">Selected Enquiry Case: </span>
                        </div>
                        
                        <!-- pill section + Enquiry case datatable -->
                        <div class="slds-grid slds-gutters slds-m-top_x-small policy-row">
                            <div class="slds-col slds-size_4-of-5">
                                <!-- <div class="pill-container"> -->
                                    <div class="pill-container">
                                        <template for:each={selectedCases} for:item="enquirtCase">
                                            <lightning-pill 
                                                class="slds-m-right_x-small slds-m-bottom_x-small"
                                                key={enquirtCase.id}
                                                label={enquirtCase.name}
                                                name={enquirtCase.id}
                                                data-case-id={enquirtCase.id}
                                                onremove={handleRemoveCase}>
                                                <lightning-icon icon-name="standard:product" alternative-text="case"></lightning-icon>
                                            </lightning-pill>
                                        </template>
                                    </div>
                                <!-- </div> -->
                            </div>
                        </div>

                        <!-- view case mode buttons -->
                        <div class="slds-m-top_large">
                            <lightning-button variant={button1Variant} name="AllEnquiries" label="All Enquiries" title="View All Enquiries" onclick={viewAllEnquiries} class="slds-m-left_x-small"></lightning-button>
                            <lightning-button variant={button2Variant} name="CurrentMasterCase" label="Current Master Case" title="View Current Master Case Enquiries" onclick={viewCurrentMasterEnquiries} class="slds-m-left_x-small"></lightning-button>
                        </div>

                        <!-- Enquiry case List DataTable -->
                        <div class="slds-m-top_small" style="clear: both; padding-top: 1rem; height: 400px;">
                            <template if:true={isCurrentMasterCase} >
                                <lightning-datatable
                                    key-field="id"
                                    data={masterCaseEnquiries}
                                    columns={enquiryColumns}
                                    selected-rows={selectedMasterEnquiryRows}
                                    onrowselection={handleEnquiryRowSelection}
                                    show-row-number-column>
                                </lightning-datatable>
                            </template>

                            <template if:true={isAllEnquiries} >
                                <lightning-datatable
                                    key-field="id"
                                    data={allEnquiries}
                                    columns={enquiryColumns}
                                    selected-rows={selectedAllEnquiryRows}
                                    onrowselection={handleEnquiryRowSelection}
                                    show-row-number-column>
                                </lightning-datatable>
                            </template>
                        </div>
                    </div>
                </div>
                
                <!-- 5.Wrap Up Details -->
                <div class="slds-text-heading_medium slds-m-bottom_medium">Wrap Up Details</div>
                <template for:each={childCases} for:item="caseItem" for:index="childIndex">
                    <div key={caseItem.id} class="case-container slds-m-bottom_large">
                        <div class="slds-box slds-theme_default">

                            <!-- Case Header -->
                            <!-- <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">

                                </div>
                            </div> -->

                            <div class="slds-grid slds-gutters slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-3">
                                    <!-- Enquirer Identity Selection -->
                                    <div class="slds-form-element slds-m-bottom_medium">
                                        <!-- <div class="slds-form-element__control">
                                            <lightning-combobox

                                                placeholder="Select Enquirer Identity"
                                                options={enquirerIdentityOptions}
                                                value={selectedEnquirerIdentity}
                                                onchange={handleEnquirerIdentityChange}>
                                            </lightning-combobox>
                                        </div> -->
                                        <lightning-input-field 
                                                field-name="CRM_Global_InquirerIdentity__c" 
                                                data-id="inquirerIdentity"
                                                onchange={handleInquirerIdentityChange}
                                                value={inquirerIdentity}
                                                data-case-id={caseItem.id}
                                                required>
                                            </lightning-input-field>
                                    </div>
                                </div>

                                <div class="slds-col slds-size_1-of-3 non-policy-col"></div>

                                <div class="slds-col slds-size_1-of-3" style="padding-top: 1.5rem;">
                                    <lightning-input 
                                        type="checkbox" 
                                        label="Non-Policy Related"
                                        checked={caseItem.nonPolicy}
                                        onchange={handleNonPolicyChange}
                                        data-case-id={caseItem.id}>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Child Case -->
                            <div class="slds-table_container">
                                <!-- Policy block (spans two columns) -->
                                <div class="wrap-up-section">
                                    <div class="slds-text-heading_small slds-m-bottom_small wrap-up-header">Select Policy</div>
                                    <!-- <div class="slds-box slds-theme_default"> -->
                                        <div class="slds-truncate" title={caseItem.policy}>
                                            <div style="float: left; margin-top: 2px;">
                                                <span class="slds-text-title">Selected Policy: </span>
                                            </div>
                                            
                                            <!-- pill section + Non-Policy toggle row -->
                                            <div class="slds-grid slds-gutters slds-m-top_x-small policy-row">
                                                <div class="slds-col slds-size_4-of-5">
                                                    <!-- <div class="pill-container"> -->
                                                        <div class={caseItem.containerClass} data-case-id={caseItem.id}>
                                                            <template for:each={caseItem.policyList} for:item="policy">
                                                                <lightning-pill 
                                                                    class="slds-m-right_x-small slds-m-bottom_x-small"
                                                                    key={policy.id}
                                                                    label={policy.name}
                                                                    name={policy.id}
                                                                    data-case-id={caseItem.id}
                                                                    onremove={handleRemovePolicy}>
                                                                    <lightning-icon icon-name="standard:product" alternative-text="Policy"></lightning-icon>
                                                                </lightning-pill>
                                                            </template>
                                                        </div>
                                                    <!-- </div> -->
                                                </div>

                                                <div class="slds-col slds-size_1-of-5">
                                                    <lightning-button 
                                                        variant="base"
                                                        label="Add New Policy"
                                                        onclick={handleOpenPolicyModal}
                                                        data-case-id={caseItem.id}
                                                        disabled={caseItem.nonPolicy}>
                                                    </lightning-button>
                                                </div>
                                            </div>

                                            <!-- Policy List DataTable -->
                                            <div class="slds-m-top_small" style="clear: both; padding-top: 1rem; height: 400px;">
                                                <lightning-datatable
                                                    key-field="id"
                                                    data={allPolicies}
                                                    columns={policyColumns}
                                                    selected-rows={selectedPolicyRows}
                                                    max-row-selection={caseItem.policyMaxRowSelection}
                                                    onrowselection={handlePolicyRowSelection}
                                                    data-case-id={caseItem.id}>
                                                </lightning-datatable>
                                            </div>
                                        </div>
                                    <!-- </div> -->
                                </div>


                                <!-- Wrap Up Section -->
                                <div class="wrap-up-section">
                                    <div class="slds-text-heading_small slds-m-bottom_small wrap-up-header">Select Wrap Up</div>
                            
                                    <div class="reason-suggestion-container">
                                        <div class="slds-grid slds-gutters slds-m-top_medium">
                                            <div class="slds-col slds-size_1-of-2">
                                                <div class="slds-form-element">
                                                    <div class="slds-form-element__control">
                                                        <!-- search box -->
                                                        <!-- <div class="search-container"> -->
                                                            <lightning-input 
                                                                type="text" 
                                                                placeholder="Search Wrap Up Category and Item..."
                                                                label="Search Wrap Up Category and Item"
                                                                value={followUpSearchTerm}
                                                                onchange={handleFollowUpSearch}
                                                                class="follow-up-search" style="width: 97%;">
                                                            </lightning-input>
                                                        <!-- </div> -->
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Wrap Up dual-listbox -->
                                    <div class="reason-suggestion-container">
                                        <div class="slds-grid slds-gutters slds-m-top_medium">
                                            <div class="slds-col slds-size_1-of-1">
                                                <div class="slds-form-element">
                                                    <div class="slds-form-element__control">
                                                        <lightning-dual-listbox name="WrapUpItem"
                                                            source-label="Available Wrap Up Category and Item"
                                                            selected-label="Selected Wrap Up"
                                                            onchange={handleWrapUphange}
                                                            options={filteredAvailableOptions}
                                                            value={selectedWrapUpItem}
                                                            data-case-id={caseItem.id}
                                                            required>
                                                        </lightning-dual-listbox>
                                                            <!-- onchange={handleReasonChange} -->
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Reason 和 Suggestion dual-listbox -->
                                    <div class="reason-suggestion-container">
                                        <div class="slds-grid slds-gutters slds-m-top_medium">
                                            <div class="slds-col slds-size_1-of-2">
                                                <div class="slds-form-element">
                                                    <!-- <label class="slds-form-element__label">Reason</label> -->
                                                    <div class="slds-form-element__control">
                                                        <lightning-dual-listbox name="Reason"
                                                            label="Reason"
                                                            source-label="Available"
                                                            selected-label="Selected"
                                                            field-level-help="Select Reason"
                                                            onchange={handleReasonChange}
                                                            options={reasonOptions}
                                                            value={selectedReason}
                                                            data-case-id={caseItem.id}></lightning-dual-listbox>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2">
                                                <div class="slds-form-element">
                                                    <div class="slds-form-element__control">
                                                        <lightning-dual-listbox name="Suggestion"
                                                            label="Suggestion"
                                                            source-label="Available"
                                                            selected-label="Selected"
                                                            field-level-help="Select Suggestion"
                                                            options={suggestionOptions}
                                                            value={selectedSuggestion}></lightning-dual-listbox>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                    <!-- Follow Up Section -->
                                <div class="wrap-up-section">
                                    <div class="slds-text-heading_small slds-m-bottom_small wrap-up-header">Follow Up</div>

                                    <!-- Follow-up row -->
                                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input 
                                                type="checkbox" 
                                                label="Active"
                                                checked={caseItem.active}
                                                onchange={handleActiveChange}
                                                data-case-id={caseItem.id}>
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input 
                                                type="date" 
                                                label="Next Follow Up Date"
                                                onchange={handleNextFollowUpDateChange}
                                                data-case-id={caseItem.id}>
                                            </lightning-input>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 6.Master Case Status -->
                <template if:true={deferChatAndEequiry} >
                    <div class="slds-text-heading_medium slds-m-bottom_medium">Master Case Status</div>
                    <div class="case-container slds-m-bottom_large">
                        <div class="slds-truncate enquiry-case-section">   
                            <lightning-radio-group name="radioGroup"
                                options={masterCaseStatusoptions}
                                value={masterCaseStatus}
                                onchange={handleMasterCaseStatusChange}
                                disabled={masterCaseStatusDisabled}
                                type="radio">
                            </lightning-radio-group>
                        </div>
                    </div>
                </template>

				<!-- button list -->
				<div class="slds-m-top_large slds-border_top slds-p-top_medium">
					<div class="slds-align_absolute-center">
						<lightning-button variant="neutral" label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
						<lightning-button variant="brand" label="Save"  onclick={handleSave}></lightning-button>
					</div>
				</div>
			</div>
		</lightning-record-edit-form>
	</div>

    <template if:true={showSpinner} >
        <div class="loading-content">
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </div>
    </template>

</template>
